<!doctype html><html lang="en"><meta charset="utf-8"><title>S06 whole-case rehearsal timer</title><style>body{background:#173547;color:white;font:20px system-ui;max-width:900px;margin:50px auto;padding:20px}#clock{font-size:90px;font-variant-numeric:tabular-nums}button{font:inherit;padding:12px;margin:8px}#stage{color:#91d5d8;font-size:26px}</style><h1>S06 — integrated ten-minute rehearsal</h1><p>Private practice only. Includes both models, AI disclosure and references.</p><div id="clock">10:00</div><div id="stage">Ready</div><p id="slot"></p><button id="go">Start / pause</button><button id="reset">Reset</button><p>No voice, external assets or telemetry. Actual spoken timing must be measured by the team.</p><script>const stages=[{"start": 0, "end": 20, "title": "Slide 1: Title"}, {"start": 20, "end": 100, "title": "Slide 2: Part 1: indicators and EDA"}, {"start": 100, "end": 170, "title": "Slide 3: Part 1: Jane-to-Finch stress"}, {"start": 170, "end": 230, "title": "Slide 4: Part 1: selected corridor and limits"}, {"start": 230, "end": 320, "title": "Slide 5: Part 2: screening and costs"}, {"start": 320, "end": 380, "title": "Slide 6: Part 2: milestones"}, {"start": 380, "end": 445, "title": "Slide 7: Part 2: benefits and policy"}, {"start": 445, "end": 475, "title": "Slide 8: AI Use Disclosure"}, {"start": 475, "end": 483, "title": "Slide 9: References 1"}, {"start": 483, "end": 490, "title": "Slide 10: References 2"}, {"start": 490, "end": 570, "title": "Slide 11: Final Recommendation: BRT"}, {"start": 570, "end": 600, "title": "Reserve \u2014 stop by 10:00"}];let elapsed=0,running=false,last=0;const q=id=>document.getElementById(id);const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};function draw(){let s=stages.find(x=>elapsed>=x.start&&elapsed<x.end);q('clock').textContent=fmt(600-elapsed);q('stage').textContent=s?s.title:'STOP — time limit';q('slot').textContent=s?'Slot remaining: '+fmt(s.end-elapsed):'';if(elapsed>=600)running=false}q('go').onclick=()=>{running=!running;last=performance.now()};q('reset').onclick=()=>{elapsed=0;running=false;draw()};setInterval(()=>{let now=performance.now();if(running)elapsed+=(now-last)/1000;last=now;draw()},100);draw();</script></html>
